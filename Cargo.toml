[package]
name = "better-audio-applet"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "COSMIC panel audio applet with per-app volume and output selection"
repository = "https://github.com/zoenetic/better-audio-applet"
rust-version = "1.90"

[dependencies]
futures = "0.3"
# The commit is pinned in Cargo.lock (build with --locked). No `rev` here: libcosmic's
# own cosmic-panel-config dependency asks for this same URL without one, and a `rev`
# would make Cargo build two copies of libcosmic, which `cargo vendor` refuses.
libcosmic = { git = "https://github.com/pop-os/libcosmic", default-features = false, features = [
    "applet",
    "applet-token",
    "dbus-config",
    "multi-window",
    "process",
    "tokio",
    "wayland",
    "winit",
] }
libpulse-binding = "2.28"
mpris2-zbus = { git = "https://github.com/pop-os/dbus-settings-bindings", rev = "eed01dd3609e90e3c8cd043656734c500956c793" }
pipewire = "0.10"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
urlencoding = "2.1"
zbus = { version = "5", default-features = false, features = ["tokio"] }

[patch."https://github.com/smithay/client-toolkit.git"]
sctk = { package = "smithay-client-toolkit", version = "0.20.0" }

[profile.release]
opt-level = 3
panic = "abort"
lto = "thin"

[patch."https://github.com/pop-os/cosmic-protocols"]
cosmic-protocols = { git = "https://github.com/pop-os/cosmic-protocols//", rev = "c0cff4d" }
cosmic-client-toolkit = { git = "https://github.com/pop-os/cosmic-protocols//", rev = "c0cff4d" }

